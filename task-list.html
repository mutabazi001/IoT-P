<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #f5f1e8;
    --paper-2: #ece5d6;
    --ink: #2b2620;
    --ink-soft: #6b6152;
    --rule: #d8cfba;
    --accent: #b5533c;
    --accent-soft: #e7d3ca;
  }

  *{ box-sizing: border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background: var(--paper);
    background-image:
      repeating-linear-gradient(180deg, transparent, transparent 34px, var(--rule) 35px);
    color: var(--ink);
    font-family: 'Space Mono', monospace;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding: 60px 20px;
    min-height: 100%;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  .sheet{
    width: 100%;
    max-width: 560px;
  }

  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom: 6px;
  }

  h1{
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 32px;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .count{
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.08em;
  }

  .rule{
    height: 2px;
    background: var(--ink);
    margin: 14px 0 28px;
  }

  form{
    display:flex;
    gap: 10px;
    margin-bottom: 30px;
  }

  input[type="text"]{
    flex:1;
    font-family: 'Space Mono', monospace;
    font-size: 15px;
    padding: 12px 14px;
    background: var(--paper-2);
    border: 1.5px solid var(--rule);
    border-radius: 3px;
    color: var(--ink);
  }
  input[type="text"]::placeholder{ color: var(--ink-soft); }
  input[type="text"]:focus{
    outline: none;
    border-color: var(--accent);
  }
  input[type="text"]:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  button{
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 3px;
    padding: 0 20px;
    cursor: pointer;
    transition: background 120ms ease;
  }
  button:hover{ background: var(--accent); }
  button:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }

  ul{
    list-style: none;
    margin: 0;
    padding: 0;
  }

  li{
    display:flex;
    align-items:center;
    gap: 12px;
    padding: 11px 4px;
    border-bottom: 1px solid var(--rule);
    animation: appear 180ms ease;
  }
  @keyframes appear{
    from{ opacity:0; transform: translateY(-4px); }
    to{ opacity:1; transform: translateY(0); }
  }

  li .num{
    font-size: 12px;
    color: var(--ink-soft);
    width: 22px;
    flex-shrink: 0;
  }

  li .label{
    flex: 1;
    font-size: 15px;
    line-height: 1.4;
    word-break: break-word;
  }

  li .del{
    background: none;
    border: none;
    color: var(--ink-soft);
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
    padding: 6px 8px;
    border-radius: 3px;
    flex-shrink: 0;
  }
  li .del:hover{ color: var(--accent); background: var(--accent-soft); }
  li .del:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }

  .empty{
    padding: 30px 4px;
    color: var(--ink-soft);
    font-size: 13px;
    text-align: center;
    border: 1px dashed var(--rule);
    border-radius: 4px;
  }
</style>
</head>
<body>

<div class="sheet">
  <header>
    <h1>Tasks</h1>
    <span class="count" id="count">0 open</span>
  </header>
  <div class="rule"></div>

  <form id="form">
    <input type="text" id="input" placeholder="Add a task…" autocomplete="off" />
    <button type="submit">Add</button>
  </form>

  <ul id="list"></ul>
  <div class="empty" id="empty">Nothing here yet — add your first task above.</div>
</div>

<script>
(function(){
  let tasks = [];
  let nextId = 1;

  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  const count = document.getElementById('count');

  function render(){
    list.innerHTML = '';
    if(tasks.length === 0){
      empty.style.display = 'block';
    } else {
      empty.style.display = 'none';
      tasks.forEach((task, i) => {
        const li = document.createElement('li');

        const num = document.createElement('span');
        num.className = 'num';
        num.textContent = String(i + 1).padStart(2, '0');

        const label = document.createElement('span');
        label.className = 'label';
        label.textContent = task.text;

        const del = document.createElement('button');
        del.className = 'del';
        del.type = 'button';
        del.textContent = 'Delete';
        del.addEventListener('click', () => {
          tasks = tasks.filter(t => t.id !== task.id);
          render();
        });

        li.appendChild(num);
        li.appendChild(label);
        li.appendChild(del);
        list.appendChild(li);
      });
    }
    count.textContent = tasks.length + (tasks.length === 1 ? ' open' : ' open');
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if(!text) return;
    tasks.push({ id: nextId++, text });
    input.value = '';
    render();
    input.focus();
  });

  render();
})();
</script>

</body>
</html>
